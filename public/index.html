// UZB-CITY-ROADS-V1
// 10 ta parallel asosiy ko‘cha
const roadMaterials = {
  asphalt: new THREE.MeshStandardMaterial({color:0x343a40}),
  sidewalk: new THREE.MeshStandardMaterial({color:0xb9b9b2}),
  line: new THREE.MeshStandardMaterial({color:0xf5f0d5})
};

const roadItems = { asphalt: [], sidewalk: [], line: [] };

function roadPlane(width,length,x,z,material) {
  const type = material === roadMaterials.asphalt ? 'asphalt' :
               material === roadMaterials.sidewalk ? 'sidewalk' : 'line';
  const y = type === 'asphalt' ? 0.036 :
            type === 'sidewalk' ? 0.05 : 0.067;
  roadItems[type].push({width,length,x,z,y});
}

const asphalt = roadMaterials.asphalt;
const sidewalk = roadMaterials.sidewalk;
const roadLine = roadMaterials.line;

for (let i=0; i<10; i++) {
  const z = -162 + i*36;

  roadPlane(470,8,0,z,asphalt);
  roadPlane(470,1.2,0,z-5.2,sidewalk);
  roadPlane(470,1.2,0,z+5.2,sidewalk);

  for(let x=-220; x<=220; x+=12) {
    roadPlane(2.5,0.13,x,z,roadLine);
  }
}

const roadGeometry = new THREE.PlaneGeometry(1,1);

for (const type of Object.keys(roadItems)) {
  const items = roadItems[type];
  const mesh = new THREE.InstancedMesh(
    roadGeometry, roadMaterials[type], items.length
  );
  const dummy = new THREE.Object3D();

  items.forEach((item,i) => {
    dummy.position.set(item.x,item.y,item.z);
    dummy.rotation.set(-Math.PI/2,0,0);
    dummy.scale.set(item.width,item.length,1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i,dummy.matrix);
  });

  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}
// UZB-CITY-ROADS-END


// UZB-CITY-CARS-V1

const carClock = new THREE.Clock();

function makeCar(color, direction, axis, position, lane) {
 const car = new THREE.Group();

 const body = new THREE.Mesh(
  new THREE.BoxGeometry(1.65,0.65,3.3),
  new THREE.MeshStandardMaterial({color, roughness:0.65})
 );
 body.position.y=0.75;
 car.add(body);

 const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.3,0.7,1.65),
  new THREE.MeshStandardMaterial({color:0x9dd9ed, roughness:0.35})
 );
 cabin.position.set(0,1.38,-0.12);
 car.add(cabin);

 const wheelMaterial = new THREE.MeshStandardMaterial({color:0x202020});
 for(const x of [-0.88,0.88]){
  for(const z of [-1.05,1.05]){
   const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.36,0.36,0.18,12),
    wheelMaterial
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,0.38,z);
   car.add(wheel);
  }
 }

 const lightMaterial = new THREE.MeshStandardMaterial({
  color:0xfff2a0, emissive:0x665522
 });
 for(const x of [-0.52,0.52]){
  const light = new THREE.Mesh(
   new THREE.BoxGeometry(0.3,0.18,0.08),
   lightMaterial
  );
  light.position.set(x,0.82,-1.67);
  car.add(light);
 }

 if(axis==='z'){
  car.position.set(position,0,lane);
  car.rotation.y=direction>0 ? Math.PI : 0;
 }else{
  car.position.set(lane,0,position);
  car.rotation.y=direction>0 ? -Math.PI/2 : Math.PI/2;
 }

 scene.add(car);
 cityCars.push({car,axis,direction,speed:3.5,position});
}

const carColors=[
 0xe53935,0x1565c0,0xfdd835,0xffffff,

];

for(let i=0;i<10;i++){

}


 // UZB-CITY-TRAFFIC-V1
 let trafficElapsed = 0;
 const trafficLights = [];

 function makeTrafficHead(offsetX) {
  const group = new THREE.Group();
  group.position.x = offsetX;
  group.position.z = 0.25;
  const lamps = {};

  for (const [name,color] of Object.entries({
   red:0xff2222,
   yellow:0xffcc00,
   green:0x22ee55
  })) {
   const material = new THREE.MeshStandardMaterial({
    color,
    emissive:color,
    emissiveIntensity:0.05
   });

   const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.18,10,10),
    material
   );

   lamp.position.y =
    name==='red' ? 0.55 :
    name==='yellow' ? 0 : -0.55;

   group.add(lamp);
   lamps[name]=material;
  }

  return {group,lamps};
 }

 function makeTrafficLight(x,z) {
  const pole = new THREE.Group();
  pole.position.set(x,0,z);

  const post = new THREE.Mesh(
   new THREE.CylinderGeometry(0.08,0.12,2.2,10),
   new THREE.MeshStandardMaterial({color:0x30363b})
  );
  post.position.y=1.1;
  pole.add(post);

  const box = new THREE.Mesh(
   new THREE.BoxGeometry(0.85,1.55,0.42),
   new THREE.MeshStandardMaterial({color:0x20252b})
  );
  box.position.y=2.5;
  pole.add(box);

  const vertical=makeTrafficHead(-0.22);
  const horizontal=makeTrafficHead(0.22);

  vertical.group.position.y=2.5;
  horizontal.group.position.y=2.5;

  pole.add(vertical.group);
  pole.add(horizontal.group);
  scene.add(pole);

  trafficLights.push({vertical,horizontal});
 }

 // Markaziy chorrahaning to‘rt burchagida
 makeTrafficLight(-3.2,-3.2);
 makeTrafficLight(3.2,-3.2);
 makeTrafficLight(-3.2,3.2);
 makeTrafficLight(3.2,3.2);

 function setTrafficHead(head,state) {
  for(const [name,material] of Object.entries(head.lamps)) {
   material.emissiveIntensity =
    name===state ? 1.8 : 0.04;
  }
 }

 function updateTrafficLights(v,h) {
  for(const light of trafficLights) {
   setTrafficHead(light.vertical,v);
   setTrafficHead(light.horizontal,h);
  }
 }
 // UZB-CITY-TRAFFIC-END


function updateCityCars(delta) {
 trafficElapsed += delta;
 const phase = trafficElapsed % 24;

 const verticalGreen = phase < 10;
 const horizontalGreen = phase >= 12 && phase < 22;

 const v = verticalGreen ? 'green' :
           phase < 12 ? 'yellow' : 'red';
 const h = horizontalGreen ? 'green' :
           phase >= 22 ? 'yellow' : 'red';

 updateTrafficLights(v,h);

 for(const item of cityCars) {
  const green = item.axis === 'z'
   ? verticalGreen : horizontalGreen;

  const stopLine = item.direction > 0 ? -4.5 : 4.5;
  const distanceToStop = (stopLine - item.position) * item.direction;

  let movement = item.speed * delta;

  if(!green && distanceToStop >= 0) {
   movement = Math.min(movement, distanceToStop);
  }

  item.position += item.direction * movement;

  if(item.position > 230) item.position = -230;
  if(item.position < -230) item.position = 230;

  if(item.axis === 'z') item.car.position.z = item.position;
  else item.car.position.x = item.position;
 }
}

// UZB-CITY-CARS-END

 // Markaziy ustun
 const fountainCenter = new THREE.Mesh(

  new THREE.MeshStandardMaterial({color:0xe0e5eb,metalness:0.4})
 );
 fountainCenter.position.y=0.76;
 cityFountain.add(fountainCenter);

 const fountainDrops=[];
 const dropMaterial=new THREE.MeshStandardMaterial({
  color:0x55d9ff,
  emissive:0x0877bb,
  emissiveIntensity:0.6
 });

 for(let i=0;i<28;i++){
  const drop=new THREE.Mesh(
   new THREE.SphereGeometry(0.075,8,8),
   dropMaterial
  );
  cityFountain.add(drop);
  fountainDrops.push({
   mesh:drop,
   phase:Math.random(),
   angle:Math.random()*Math.PI*2
  });
 }

 // Moviy dekorativ chiroq
 const fountainLight=new THREE.PointLight(0x35bfff,2.5,15);
 fountainLight.position.set(0,2,0);
 cityFountain.add(fountainLight);

 function updateCityFountain(delta){
  for(const item of fountainDrops){
   item.phase=(item.phase+delta*0.8)%1;
   const t=item.phase;
   const arc=Math.sin(t*Math.PI);
   const radius=0.2+t*1.1;

   item.mesh.position.set(
    Math.cos(item.angle)*radius,
    1.05+arc*2.5,
    Math.sin(item.angle)*radius
   );
  }
 }
 // UZB-CITY-FOUNTAIN-END



// UZB-MAHALLA-YOLAKLAR-START
const mahallaPaths = new THREE.Group();
scene.add(mahallaPaths);

const mahallaPathMaterial = new THREE.MeshStandardMaterial({
 color:0xd8c6a4,
 roughness:1
});

function buildMahallaPaths(houses) {
 mahallaPaths.clear();

 const rows = new Map();

 houses.forEach(h => {
  const x = Number(h.house?.x);
  const z = Number(h.house?.z);
  if(!Number.isFinite(x) || !Number.isFinite(z)) return;
  if(!rows.has(z)) rows.set(z,[]);
  rows.get(z).push({x,z});
 });

 for(const row of rows.values()) {
  row.sort((a,b)=>a.x-b.x);
  const streetZ = -162 + Math.round((row[0].z + 162)/36)*36;
  const direction = row[0].z < streetZ ? 1 : -1;
  const minX = row[0].x-5;
  const maxX = row[row.length-1].x+5;

  const path = new THREE.Mesh(
   new THREE.BoxGeometry(maxX-minX,0.10,1.2),
   mahallaPathMaterial
  );

  path.position.set(
   (minX+maxX)/2,
   0.06,
   row[0].z + direction*4.95
  );
  mahallaPaths.add(path);
 }
}
// UZB-MAHALLA-YOLAKLAR-END

 // Poydevor va asosiy devorlar

  addBox(2.1,0.14,0.28,woodMat,side,4.2,4.18);
 }

 // Kirish zinapoyasi
 addBox(2.5,0.22,1.1,frameMat,0,0.11,4.85);
 addBox(2.1,0.2,0.65,frameMat,0,0.31,4.55);

 // Uy oldidagi kichik chiroqlar
 for(const side of [-1.65,1.65]){

// UZB-CITY-BOUNDARY-V1
let cityBoundary = null;

function updateCityBoundary(houses) {
  if (cityBoundary) {
    scene.remove(cityBoundary);
    cityBoundary.traverse(obj => {
      if (obj.isMesh) obj.geometry.dispose();
    });
  }

  cityBoundary = new THREE.Group();

  const positions = houses
    .filter(h => h.house && Number.isFinite(Number(h.house.x)) && Number.isFinite(Number(h.house.z)))
    .map(h => ({x:Number(h.house.x), z:Number(h.house.z)}));

  if (!positions.length) return;

  const minX = Math.min(...positions.map(p => p.x)) - 10;
  const maxX = Math.max(...positions.map(p => p.x)) + 10;
  const minZ = Math.min(...positions.map(p => p.z)) - 10;
  const maxZ = Math.max(...positions.map(p => p.z)) + 10;

  const width = maxX - minX;
  const depth = maxZ - minZ;
  const cx = (minX + maxX) / 2;
  const cz = (minZ + maxZ) / 2;

  const height = 2.5;
  const thickness = 0.7;

  const wallMaterial = new THREE.MeshStandardMaterial({
    color: 0x2865b8,
    emissive: 0x102b55,
    transparent: true,
    opacity: 0.72
  });

  function addWall(w, d, x, z) {
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(w, height, d),
      wallMaterial
    );
    wall.position.set(x, height / 2, z);
    cityBoundary.add(wall);
  }

  addWall(width + thickness, thickness, cx, minZ);
  addWall(width + thickness, thickness, cx, maxZ);
  addWall(thickness, depth + thickness, minX, cz);
  addWall(thickness, depth + thickness, maxX, cz);

  scene.add(cityBoundary);
}

async function findHouse(){
 const input = document.getElementById('houseQuery');
 const result = document.getElementById('searchResult');
 const query = input.value.trim().toLowerCase().replace(/^@/, '');
 if(!query){
   result.textContent = 'Username yoki uy raqamini kiriting';
   return;
 }
 try{
   const response = await fetch('/api/houses');
   const houses = await response.json();
   const code = query.toUpperCase().replace(/^UZB-/, '');
   const found = houses.find(h =>
     h.username.toLowerCase() === query ||
     String(h.house.id) === code
   );
   if(!found){
     result.textContent = 'Bunday uy topilmadi';
     return;
   }
   const obj = houseObjects.find(h =>
     h.userData.username === found.username
   );
   if(!obj){
     result.textContent = 'Uy xaritada topilmadi';
     return;
   }
   if(highlightedHouse){
     highlightedHouse.children[0].material.color.copy(
       highlightedHouse.userData.originalColor
     );
   }
   highlightedHouse = obj;
   obj.children[0].material.color.set(0xffd700);
   controls.target.set(found.house.x, 0, found.house.z);
   camera.position.set(found.house.x+20, 18, found.house.z+24);
   controls.update();
   result.textContent = '🏠 @' + found.username + ' uyi topildi!';
 }catch(e){
   result.textContent = 'Qidirishda xatolik yuz berdi';
 }
}
window.findHouse = findHouse;

const virtualPeople = [];
let virtualPeopleStarted = false;
let virtualPeopleHomes = [];
let virtualPeopleHome = null;

const personBodyGeometry = new THREE.CylinderGeometry(0.25,0.3,0.9,8);
const personHeadGeometry = new THREE.SphereGeometry(0.22,8,8);
const personMaterials = [0x3567a8,0x3b8b58,0xb36a35,0x7951a8,0x555b65]
 .map(color => new THREE.MeshStandardMaterial({color}));

function addVirtualPerson(preferredHome = null) {
 if(virtualPeople.length >= 100) return;

 const person = new THREE.Group();
 const body = new THREE.Mesh(
  personBodyGeometry,
  personMaterials[Math.floor(Math.random()*personMaterials.length)]
 );
 body.position.y = 0.75;
 person.add(body);

 const head = new THREE.Mesh(
  personHeadGeometry,
  new THREE.MeshStandardMaterial({color:0xd6a477})
 );
 head.position.y = 1.4;
 person.add(head);

 const row = Math.floor(Math.random()*100);
 const home = preferredHome || virtualPeopleHomes[Math.floor(Math.random()*virtualPeopleHomes.length)];
 const location = home && home.house ? home.house : {x:0,z:0};
 person.position.set(
  Number(location.x) + Math.random()*28-14,
  0,
  Number(location.z) + 9 + Math.random()*8
 );
 person.userData.direction = Math.random()<0.5 ? 1 : -1;
 person.userData.speed = 1+Math.random()*1.2;

 virtualPeopleGroup.add(person);
 virtualPeople.push(person);
}

function startVirtualPeople(houses) {
 if(virtualPeopleStarted) return;
 virtualPeopleStarted = true;

 virtualPeopleHomes = houses || [];
 virtualPeopleHome = virtualPeopleHomes.find(h => h.username === myUser) || virtualPeopleHomes[0] || null;

 for(let i=0;i<15;i++) addVirtualPerson(virtualPeopleHome);
 setInterval(() => addVirtualPerson(),5000);
}

function updateVirtualPeople(delta) {
 virtualPeople.forEach(person => {
  person.position.x += person.userData.direction*person.userData.speed*delta;

  if(person.position.x > 62) {
   person.position.x = 62;
   person.userData.direction = -1;
  }
  if(person.position.x < -62) {
   person.position.x = -62;
   person.userData.direction = 1;
  }
 });
}
// UZB-VIRTUAL-PEOPLE-END
